<!doctype html>
<html>
	<head>
		<meta charset="utf-8">
		<link rel="icon" type="image/svg+xml" href="/shoe.svg" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Home</title>
	</head>

	<body>
		<main class="font-inter">
			<header class="flex justify-between items-center mx-[5.60vw]">
				<section class="flex flex-col gap-y-[10px] py-[1.16vh] justify-between font-medium text-base/[100%]">
					<span id="greeting" class="text-greeting"><span class="font-semibold">👋</span></span>
					<span id="span-of-user-name-show" class="font-bold text-title"></span>
				</section>
				<section class="flex gap-x-4">
					<svg id="bell-svg" width="21" height="23" viewBox="0 0 21 23" fill="none" xmlns="http://www.w3.org/2000/svg"></svg>
					<svg id="heart-svg" width="24" height="23" viewBox="0 0 24 23" fill="none" xmlns="http://www.w3.org/2000/svg"></svg>
				</section>
			</header>
			<section class="relative mx-[5.60vw] bg-input mt-[0.58vh]">
				<input id="search-input" type="search" placeholder="Search" class="w-full pl-[34px] py-2 rounded-sm placeholder:text-sm/[150%] placeholder:font-normal placeholder:text-placeholder focus:outline-2 outline-black">
				<svg id="search-svg" class="absolute left-[13px] top-[10.5px] text-cool-gray-600" width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg"></svg>
			</section>
			<section class="flex justify-between mx-[5.60vw] mt-[2.17vh] font-semibold leading-[1] text-title">
				<span class="text-[1.25rem]">Most Popular</span>
				<span class="text-base">See All</span>
			</section>
			<section id="wrapper-of-brand-names" class="flex gap-x-2 ml-[5.60vw] mt-[1.45vh] leading-none font-semibold text-base overflow-x-auto">
				<button disabled class="brands border-2 border-brand px-5 py-[10px] rounded-[1.56rem] disabled:text-white disabled:bg-brand cursor-pointer bg-white text-brand">All</button>
			</section>
			<section id="container-of-products-section" class="grid grid-cols-[repeat(auto-fit,minmax(182px,1fr))] gap-x-4 gap-y-6 mx-[5.60vw] mt-[1.74vh]">
				<div>
					<img src="https://static.nike.com/a/images/c_limit,w_592,f_auto/t_product_v1/i1-665455a5-45de-40fb-945f-c1852b82400d/react-infinity-run-flyknit-mens-running-shoe-zX42Nc.jpg" alt="shoe pic" class="rounded-3xl">
					<h3 class="font-bold text-[1.125rem]/none tracking-[-4%] text-title mt-3 mb-2">K-Swiss ista Train...</h3>
					<p class="text-title font-semibold text-base/none">$ 85.00</p>
				</div>
				<div class="overflow-hidden">
					<img class='rounded-3xl' src="https://static.nike.com/a/images/c_limit,w_592,f_auto/t_product_v1/i1-665455a5-45de-40fb-945f-c1852b82400d/react-infinity-run-flyknit-mens-running-shoe-zX42Nc.jpg" alt="shoe pic">
					<h3>K-Swiss ista Train...</h3>
					<p>$ 85.00</p>
				</div>
				<div class="overflow-hidden">
					<img class='rounded-3xl' src="https://static.nike.com/a/images/c_limit,w_592,f_auto/t_product_v1/i1-665455a5-45de-40fb-945f-c1852b82400d/react-infinity-run-flyknit-mens-running-shoe-zX42Nc.jpg" alt="shoe pic">
					<h3>K-Swiss ista Train...</h3>
					<p>$ 85.00</p>
				</div>
				<div class="overflow-hidden">
					<img class='rounded-3xl' src="https://static.nike.com/a/images/c_limit,w_592,f_auto/t_product_v1/i1-665455a5-45de-40fb-945f-c1852b82400d/react-infinity-run-flyknit-mens-running-shoe-zX42Nc.jpg" alt="shoe pic">
					<h3>K-Swiss ista Train...</h3>
					<p>$ 85.00</p>
				</div>
				
			</section>
		</main>
		<script type="module" src="src/main.js"></script>
		<script type="module" src="src/home.js"></script>
	</body>
</html>
