<!doctype html>
<!--address.html-->
<html>
	<head>
		<meta charset="utf-8">
		<link rel="icon" type="image/svg+xml" href="/shoe.svg" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Address</title>
	</head>

<body class="flex flex-col min-h-dvh font-inter">
	<header class="flex items-center mx-[5.60vw] gap-x-4 mt-4 mb-7">
		<img src="public/leftArrow.svg" alt="back">
		<span class="text-[1.5rem]/[100%] font-semibold text-title">Shipping Address</span>
	</header>
	<main id="main" class="flex-1 mx-[5.60vw] pb-23">
		<div id="wrapper" class="flex flex-col gap-y-5">
			<label class="flex items-center justify-between p-5 rounded-3xl bg-white cursor-pointer shadow-cart">
        <div class="flex items-center gap-4">
                <svg width="52" height="52" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
				  <!-- دایره بیرونی -->
				  <circle cx="16" cy="16" r="15" stroke="currentColor" stroke-width="0" fill="#292928" opacity='0.1'/>
				  <!-- دایره داخلی (پس‌زمینه مشکی) -->
				  <circle cx="16" cy="16" r="10" fill="currentColor"/>
				  <!-- آیکون لوکیشن -->
				  <path d="M16 9C13.8 9 12 10.8 12 13C12 16.5 16 21 16 21C16 21 20 16.5 20 13C20 10.8 18.2 9 16 9Z" fill="white"/>
				  <circle cx="16" cy="13" r="2" fill="black"/>
				</svg>
            <div>
                <div class="flex items-center gap-2">
                    <h3 class="font-semibold">Home</h3>
                    <span class="text-xs bg-gray-100 px-2 py-1 rounded-full">Default</span>
                </div>
                <p class="text-sm text-gray-500">61480 Sunbrook Park, PC 5679</p>
            </div>
        </div>
		<input type="radio" name="address" value="home" checked class="size-4 accent-radio">
    </label>
		</div>
		<!--		new address modal-->
		<section id="newAddressSection" class="hidden w-vw h-dvh fixed inset-0 bg-radio/80 flex flex-col justify-center items-center px-[5.60vw] z-1">
			<div class="bg-white bg-white rounded-xl p-4">
				<div class="flex justify-between items-center mb-3">
					<p class="text-lg font-semibold text-cool-gray-800">New Address</p>
					<svg id="dialog-close-btn" class="hover:bg-red-50 hover:rounded-full hover:cursor-pointer size-7" width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
						<path class='close-path' fill-rule="evenodd" clip-rule="evenodd" d="M18.8504 6.45054C19.2097 6.09126 19.2097 5.50874 18.8504 5.14946C18.4912 4.79018 17.9086 4.79018 17.5494 5.14946L11.9999 10.6989L6.45043 5.14946C6.09113 4.79018 5.50862 4.79018 5.14934 5.14946C4.79006 5.50874 4.79006 6.09126 5.14934 6.45054L10.6988 12L5.14934 17.5495C4.79006 17.9088 4.79006 18.4912 5.14934 18.8506C5.50862 19.2098 6.09113 19.2098 6.45043 18.8506L11.9999 13.3011L17.5494 18.8506C17.9086 19.2098 18.4912 19.2098 18.8504 18.8506C19.2097 18.4912 19.2097 17.9088 18.8504 17.5495L13.301 12L18.8504 6.45054Z" fill="#6B7280"/>
					</svg>
				</div>
			<form id="new-address-form" class="">
					<label for="title" class="text-[0.875rem] font-semibold text-gray-500">Title</label>
					<input id="title" placeholder="Enter a title" type="text" class="mt-1 border border-cool-gray-100 shadow-input rounded-xl px-[13px] py-[9px] w-full placeholder:text-[0.875rem] placeholder:font-normal placeholder:text-cool-gray-300 focus:outline focus:outline-primary-100">
					<p id="title-err" class="hidden text-red-400  font-semibold text-xs mt-1 pl-1"></p>
					<label for="description" class="text-[0.875rem] font-semibold text-gray-500 inline-block mt-5">Address</label>
					<textarea /*required*/ rows="5" id="description" placeholder="Enter the description" type='' class="border border-cool-gray-100 shadow-input rounded-xl px-[13px] py-[9px] mt-1 w-full placeholder:text-[0.875rem] placeholder:font-normal placeholder:text-cool-gray-300 focus:outline focus:outline-primary-100"></textarea>
					<p id="description-err" class="hidden text-red-400  font-semibold text-xs mt-1 pl-1"></p>
					<button type="submit" class="text-white text-[0.875rem] bg-radio py-xs mt-5 rounded-md w-full hover:bg-radio/80 py-2 cursor-pointer">Add</button>
				</form>
			</div>
		</section>
		<button id="addNewAddressBtn" class="text-radio font-semibold bg-gray-200 w-full py-4 my-4 rounded-full cursor-pointer">Add New Address</button>
	</main>
	<footer class="px-[5.60vw] fixed bottom-0 inset-x-0 rounded-t-3xl bg-white/40 backdrop-blur-lg border-t border-gray-500/50">
		<button class="text-white font-semibold bg-radio w-full my-4 py-4 rounded-full cursor-pointer shadow-cart">Apply</button>
	</footer>
	
	<script type="module" src="src/main.js"></script>
	<script type="module" src="src/address.js"></script>
</body>
</html>
